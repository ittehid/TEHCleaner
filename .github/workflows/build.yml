name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\src\TEHCleaner\TEHCleaner.csproj -r win-x64

      - name: Build
        run: dotnet build .\src\TEHCleaner\TEHCleaner.csproj -c Release --no-restore

      - name: Publish self-contained x64
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: TEHCleaner-win-x64
          path: artifacts/win-x64/
